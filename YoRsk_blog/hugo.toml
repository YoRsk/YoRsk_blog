baseURL = "https://yorsk.github.io/"
languageCode = "en-us"
title = "The Simple"
theme = "hugo-PaperMod"
mainSections = ["posts"]
# cloud-build: 由 GitHub Actions (deploy.yml) 自动构建部署

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  # --- 青碧 × 冷灰 个性化增强 ---
  description = "YoRsk 的个人博客：记录代码、折腾与思考。"
  author = "YoRsk"
  keywords = ["YoRsk", "The Simple", "博客", "技术笔记", "Hugo", "PaperMod"]
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowScrollToTop = true
  ShowToc = false

# --- 首页个性化横幅（hero）：头像 + 签名 + 社交入口 ---
[params.homeInfoParams]
  Title = "The Simple · YoRsk"
  Content = "在这里记录代码、折腾与思考 —— **简单，但不将就。**"
  Image = "avatar.svg"

[[params.socialIcons]]
  name = "github"
  title = "GitHub"
  url = "https://github.com/YoRsk"

[[params.socialIcons]]
  name = "rss"
  title = "RSS"
  url = "/index.xml"

[[menus.main]]
  name = "笔记"
  pageRef = "/notes/"
  weight = 10

[[menus.main]]
  name = "管理"
  url = "/admin/"
  weight = 20
